<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphism Generator - Vibecoding Clone</title>
    <style>
        /* CSS - Estilização e Tematização */
        :root {
            --bg-color: #e0e5ec;
            --text-color: #444;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent-color: #6d5dfc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.2s ease;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 800px;
            gap: 2rem;
            padding: 20px;
        }

        /* Área de Preview */
        .preview-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 300px;
        }

        .neumorphic-element {
            width: 200px;
            height: 200px;
            background-color: var(--bg-color);
            border-radius: 40px;
            transition: box-shadow 0.1s ease, background-color 0.2s ease;
        }

        /* Painel de Controles */
        .controls-panel {
            background: var(--bg-color);
            padding: 2.5rem;
            border-radius: 30px;
            width: 100%;
            box-shadow: 9px 9px 16px var(--shadow-dark), 
                        -9px -9px 16px var(--shadow-light);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
            opacity: 0.8;
        }

        .controls-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: var(--bg-color);
            border-radius: 5px;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), 
                        inset -2px -2px 5px var(--shadow-light);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        input[type="color"] {
            border: none;
            width: 100%;
            height: 40px;
            cursor: pointer;
            background: none;
            border-radius: 8px;
        }

        /* Display de Código */
        .code-display {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--bg-color);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: inset 3px 3px 7px var(--shadow-dark), 
                        inset -3px -3px 7px var(--shadow-light);
        }

        code {
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            color: var(--accent-color);
        }

        #copy-btn {
            align-self: flex-end;
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                        -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
            transition: all 0.2s;
        }

        #copy-btn:active {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), 
                        inset -2px -2px 5px var(--shadow-light);
        }
    </style>
</head>
<body>

    <main class="main-container">
        <section class="preview-area">
            <div id="element-preview" class="neumorphic-element"></div>
        </section>

        <section class="controls-panel">
            <h1>Neumorphism Generator</h1>
            
            <div class="controls-wrapper">
                <div class="control-group">
                    <label for="colorInput">Cor de Fundo</label>
                    <input type="color" id="colorInput" value="#e0e5ec">
                </div>

                <div class="control-group">
                    <label for="distanceInput">Distância</label>
                    <input type="range" id="distanceInput" min="5" max="50" value="20">
                </div>

                <div class="control-group">
                    <label for="blurInput">Desfoque (Blur)</label>
                    <input type="range" id="blurInput" min="0" max="100" value="60">
                </div>

                <div class="control-group">
                    <label for="intensityInput">Intensidade</label>
                    <input type="range" id="intensityInput" min="0.01" max="0.3" step="0.01" value="0.15">
                </div>
            </div>

            <div class="code-display">
                <code id="css-output">box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;</code>
                <button id="copy-btn">Copiar Código</button>
            </div>
        </section>
    </main>

    <script>
        // JS - Lógica de Comportamento
        const preview = document.getElementById('element-preview');
        const colorInput = document.getElementById('colorInput');
        const distanceInput = document.getElementById('distanceInput');
        const blurInput = document.getElementById('blurInput');
        const intensityInput = document.getElementById('intensityInput');
        const cssOutput = document.getElementById('css-output');
        const copyBtn = document.getElementById('copy-btn');

        /**
         * Função Utilitária: Ajusta brilho da cor hex para criar sombras
         */
        function adjustBrightness(hex, factor) {
            hex = hex.replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);

            r = Math.max(0, Math.min(255, r + (r * factor)));
            g = Math.max(0, Math.min(255, g + (g * factor)));
            b = Math.max(0, Math.min(255, b + (b * factor)));

            const toHex = (n) => Math.round(n).toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        }

        function updateNeumorphism() {
            const baseColor = colorInput.value;
            const dist = distanceInput.value;
            const blur = blurInput.value;
            const intensity = parseFloat(intensityInput.value);

            // Gerando as duas sombras necessárias para o efeito
            const darkShadow = adjustBrightness(baseColor, -intensity);
            const lightShadow = adjustBrightness(baseColor, intensity + 0.2); // Sombra clara geralmente é mais viva

            const shadowString = `${dist}px ${dist}px ${blur}px ${darkShadow}, -${dist}px -${dist}px ${blur}px ${lightShadow}`;

            // Aplicando Estilos dinamicamente
            document.body.style.backgroundColor = baseColor;
            preview.style.backgroundColor = baseColor;
            preview.style.boxShadow = shadowString;
            
            // Atualizando as variáveis de CSS para os controles também se adaptarem
            document.documentElement.style.setProperty('--bg-color', baseColor);
            document.documentElement.style.setProperty('--shadow-dark', darkShadow);
            document.documentElement.style.setProperty('--shadow-light', lightShadow);

            // Output do Código
            cssOutput.textContent = `box-shadow: ${shadowString};`;
        }

        // Evento de Cópia
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(cssOutput.textContent);
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copiado!';
            setTimeout(() => copyBtn.textContent = originalText, 1500);
        });

        // Listeners
        [colorInput, distanceInput, blurInput, intensityInput].forEach(el => {
            el.addEventListener('input', updateNeumorphism);
        });

        // Init
        updateNeumorphism();
    </script>
</body>
</html>
